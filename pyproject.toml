[project]
name = "starter"
version = "0.1.0"
description = "FastAPI starter with JWT auth: register, login, protected routes, password hashing."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "email-validator>=2.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src/modules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's idiomatic Depends() in defaults
